name: Build Zendesk Theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Zendesk theme 2029.0.0
        shell: pwsh
        run: ./package-theme.ps1 -ReleaseVersion 2029.0.0

      - name: Verify packaged manifest version
        shell: python
        run: |
          import json, zipfile
          archive = "digified-theme-2029.0.0.zip"
          with zipfile.ZipFile(archive) as zf:
              manifest = json.loads(zf.read("manifest.json").decode("utf-8"))
          assert manifest["version"] == "2029.0.0", manifest["version"]
          print("Verified theme version:", manifest["version"])

      - name: Upload Zendesk theme
        uses: actions/upload-artifact@v4
        with:
          name: digified-theme-2029.0.0
          path: digified-theme-2029.0.0.zip
          if-no-files-found: error
